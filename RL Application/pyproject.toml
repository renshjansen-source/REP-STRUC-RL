[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["environment"]

[tool.hatch.build.targets.wheel.force-include]
"internal_variables.py" = "internal_variables.py"

[project]
name = "environment"
version = "0.0.1"
dependencies = [
  "gymnasium",
  "numpy",
  "scipy",
]